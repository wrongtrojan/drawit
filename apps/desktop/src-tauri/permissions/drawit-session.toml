[[permission]]
identifier = "allow-drawit-session"
description = "Allows the desktop shell to read the local drawit session descriptor."
commands.allow = ["drawit_session", "drawit_mcp_config"]
[[permission]]
identifier = "allow-drawit-confirmation"
description = "Confirm user initiated destructive actions and unsaved window closure"
commands.allow = ["drawit_confirm_action"]
[[permission]]
identifier = "allow-drawit-diagnostic"
description = "Write bounded local UI failure diagnostics"
commands.allow = ["drawit_diagnostic"]
[[permission]]
identifier = "allow-drawit-file-broker"
description = "Use native-picked, document-bound directory handles"
commands.allow = ["drawit_choose_directory", "drawit_write_artifact", "drawit_external_file"]
